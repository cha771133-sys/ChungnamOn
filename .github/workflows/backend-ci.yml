name: Backend CI

on:
  pull_request:
    branches: [dev, main]

# 같은 PR에 새 커밋이 올라오면 이전 실행은 취소한다.
concurrency:
  group: backend-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    # 필수 체크 이름. 바꾸면 ruleset의 required status check도 같이 바꾼다.
    name: backend-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: chungnamon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SECRET_KEY: ci-only-dummy-key
      DATABASE_URL: postgres://ci:ci-only@localhost:5432/chungnamon

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # 필수 체크라 항상 결과를 남겨야 한다. 관련 변경이 없으면 검사 단계만 건너뛴다.
      - name: 변경 확인
        id: changes
        working-directory: .
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -qE '^(backend/|\.github/workflows/backend-ci\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend 변경 없음, 검사 생략"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Python 3.14
        if: steps.changes.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: 의존성 설치
        if: steps.changes.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: 마이그레이션 체크
        if: steps.changes.outputs.run == 'true'
        run: python manage.py makemigrations --check --dry-run

      - name: 마이그레이션 적용
        if: steps.changes.outputs.run == 'true'
        run: python manage.py migrate

      - name: 테스트
        if: steps.changes.outputs.run == 'true'
        run: python manage.py test
